<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series Catalogue</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">    
</head>
<body>
    <header class="header">
        <h1>Series</h1> 
            <div class="menu">
            <span class="menu-toggle">☰</span>
                <nav class="menu-list">
                    <a href="#home">Home</a>
                    <a href="#catalogue">Catalogue</a>
                    <a href="#add">Add series</a>
                </nav>
            </div>
    </header>
    <!-- Hero image (landing) -->
        <section id="home" class="hero-image">
            <div class="hero-text">
                <h2>Top Series</h2>
                <p>A catalogue you cannot miss</p>
        
             </div>
        </section>
        
        <!-- Filter catalogue -->
        <div id="catalogue" class="filter-container"></div>
      
        <!-- Catalogue with series -->
        <section id="Series">
            <div class="series-container"></div>
        </section>
    

    <!-- FORM -->
    <form id="userForm">
        <div class="form-container">
        <h2 id="add">Add your series</h2>
        <p>You can add your favourite serie from our category</p>
        <input type="text" id="Title" placeholder="Title" name="title" required><br>
        <input type="number" id="Year" placeholder="Year" name="year" min = "1900" required><br>
        <textarea id="Infoseries" rows= "4" cols="30" placeholder="Description" name="info" required></textarea>
        <span>Category</span>
        <select id="category" name="category">
        <option value="Thriller">Thriller</option>
        <option value="Mystery">Mysterie</option>
        <option value="Drama">Drama</option>
        <option value="Western">Western</option>
        </select><br>
        <button class="add-btn" type="submit">Add</button>
      </div>
    </form>

    <footer>
        <p>&copy; 2026 Series Catalogue</p>
    </footer>
</body>
</html>
